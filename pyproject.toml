[project]
name = "cakesync"
version = "0.1.0"
description = "Stateless sync of CardDAV contact birthdays and CalDAV calendar events into Todoist projects."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
keywords = ["todoist", "carddav", "caldav", "calendar", "birthday", "contacts", "sync", "fastmail", "icloud", "nextcloud"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Communications",
    "Topic :: Office/Business :: Scheduling",
    "Topic :: Utilities",
]
dependencies = [
    "requests>=2.31",
    "vobject>=0.9.9",
    "python-dotenv>=1.0",
    "PyYAML>=6.0",
    "icalendar>=6.0",
    "recurring-ical-events>=3.3",
    # Some events name a TZID without shipping the matching VTIMEZONE block, and
    # Windows has no system tz database to fall back on.
    "tzdata>=2024.1",
]

[project.urls]
Repository = "https://github.com/alxbd/cakesync"
Issues = "https://github.com/alxbd/cakesync/issues"

[project.scripts]
cakesync = "main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = [
    "cakesync.example.yml",
    "main.py",
    "config.py",
    "dav.py",
    "carddav.py",
    "caldav.py",
    "markers.py",
    "sync.py",
    "todoist.py",
]

[tool.hatch.build.targets.sdist]
include = [
    "main.py",
    "config.py",
    "dav.py",
    "carddav.py",
    "caldav.py",
    "markers.py",
    "sync.py",
    "todoist.py",
    "cakesync.example.yml",
    "README.md",
    "LICENSE",
    "pyproject.toml",
    "tests",
]

[dependency-groups]
dev = [
    "ruff>=0.6",
    "ty",
    "pytest>=8.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"

[tool.ty.src]
include = [
    "main.py",
    "config.py",
    "dav.py",
    "carddav.py",
    "caldav.py",
    "markers.py",
    "sync.py",
    "todoist.py",
    "tests",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
